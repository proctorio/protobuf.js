# Grouping is the point: single-package bumps against this fork's large dev
# tree arrive as an endless stream of one-line lockfile PRs. Group them so
# each cycle is one reviewable pull request per update type.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
